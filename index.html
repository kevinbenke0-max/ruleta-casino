<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Casino - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="classic-casino-theme" style="justify-content: center; align-items: center;">

    <div class="casino-box">
        <h1 class="casino-title">🎰 ROYAL CASINO</h1>
        <p class="casino-subtitle">Ingrese sus credenciales para jugar</p>

        <form id="login-form" class="casino-form">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="username" placeholder="Ej: admin" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="Contraseña (1234)" required>
            </div>
            <button type="submit" class="btn-primary">ENTRAR AL CASINO</button>
        </form>

        <div style="margin-top: 15px; text-align: center;">
            <a href="cajero.html" style="color: #ffd700; font-size: 0.8rem; text-decoration: none; font-weight: 700;">⚙️ Ir al Panel del Cajero</a>
        </div>
    </div>

    <script>
        function getUsersDB() {
            let users = localStorage.getItem('casino_users');
            if (!users) {
                let defaultUsers = { "admin": { pass: "1234", chips: 5000 } };
                localStorage.setItem('casino_users', JSON.stringify(defaultUsers));
                return defaultUsers;
            }
            return JSON.parse(users);
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const inputUser = document.getElementById('username').value.trim().toLowerCase();
            const inputPass = document.getElementById('password').value.trim();
            let users = getUsersDB();

            let matchedUserKey = Object.keys(users).find(key => key.toLowerCase() === inputUser);

            if (matchedUserKey && String(users[matchedUserKey].pass) === String(inputPass)) {
                sessionStorage.setItem('active_user', matchedUserKey);
                window.location.href = "tragamonedas.html";
            } else {
                alert("❌ Usuario o contraseña incorrectos. (Pruebe admin / 1234)");
            }
        });
    </script>
</body>
</html>
