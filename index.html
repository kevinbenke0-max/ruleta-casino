<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Casino - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="classic-casino-theme">

    <div class="casino-box">
        <div class="casino-header">
            <span class="casino-badge">CASINO ONLINE EN VIVO</span>
            <h1 class="casino-title">🎰 ROYAL CASINO</h1>
            <p class="casino-subtitle">Ingresá con tu cuenta para entrar a la sala VIP</p>
        </div>

        <div id="login-error" class="inline-error"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ej: admin" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password" required style="padding-right: 40px;">
                    <button type="button" class="toggle-pass-btn" id="toggle-pass" aria-label="Mostrar contraseña">👁️</button>
                </div>
            </div>

            <button type="submit" id="btn-login" class="btn btn-primary" style="margin-top: 8px;">
                ENTRAR AL CASINO
            </button>
        </form>

        <div class="casino-footer-links">
            <div class="demo-hint">
                Cuenta inicial: <strong>admin</strong> | Clave: <strong>1234</strong>
            </div>
            <a href="cajero.html" class="casino-link">⚙️ Acceso Panel del Cajero</a>
        </div>
    </div>

    <script type="module">
        import { db, ref, get, isConfigured, ensureAdminExists } from "./firebase-config.js";

        const errorBox = document.getElementById("login-error");
        const loginBtn = document.getElementById("btn-login");
        const passInput = document.getElementById("password");
        const toggleBtn = document.getElementById("toggle-pass");

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.classList.add("visible");
        }

        function hideError() {
            errorBox.classList.remove("visible");
        }

        toggleBtn.addEventListener("click", () => {
            const isHidden = passInput.type === "password";
            passInput.type = isHidden ? "text" : "password";
            toggleBtn.textContent = isHidden ? "🙈" : "👁️";
        });

        if (!isConfigured) {
            showError("⚠️ Falta configurar firebase-config.js");
            loginBtn.disabled = true;
        } else {
            ensureAdminExists().catch(() => {
                showError("❌ No se pudo conectar con Firebase. Revisá las reglas de Realtime Database.");
            });
        }

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!isConfigured) return;

            hideError();
            const cleanUser = document.getElementById("username").value.trim().toLowerCase();
            const inputPass = passInput.value.trim();

            if (!/^[a-z0-9_-]+$/.test(cleanUser)) {
                showError("❌ El usuario contiene caracteres no válidos.");
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = "CONECTANDO...";

            try {
                const snap = await get(ref(db, `users/${cleanUser}`));
                if (snap.exists() && String(snap.val().pass) === String(inputPass)) {
                    sessionStorage.setItem("active_user", cleanUser);
                    window.location.href = "lobby.html";
                } else {
                    showError("❌ Usuario o contraseña incorrectos.");
                }
            } catch (err) {
                console.error(err);
                showError("❌ Error de conexión con Firebase.");
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = "ENTRAR AL CASINO";
            }
        });
    </script>
</body>
</html>
