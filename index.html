<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Casino - Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="screen-login" class="screen active">
        <div class="login-card">
            <div class="logo">
                <h1>ROYAL CASINO</h1>
                <p>VIP GAMBLING EXPERIENCE</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" placeholder="Tu usuario asignado" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">ENTRAR AL CASINO</button>
            </form>
            <div style="margin-top: 20px; font-size: 0.8rem;">
                <a href="cajero.html" style="color: #d4af37; text-decoration: none;">🔐 Acceso Exclusivo Cajero / Admin</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
