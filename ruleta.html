<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Casino - Ruleta Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="pokerstars-theme vertical-layout">

    <!-- BARRA SUPERIOR -->
    <header class="top-bar">
        <div class="brand">
            <span class="star-icon">★</span>
            <span class="brand-title">ROYAL CASINO</span>
        </div>
        <div class="user-stats">
            <div class="stat-box">
                <span class="stat-label">JUGADOR</span>
                <span id="player-display" class="stat-val">-</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">SALDO</span>
                <span class="stat-val">$<span id="user-chips">0</span></span>
            </div>
            <button onclick="logout()" class="btn-exit">SALIR</button>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL VERTICAL -->
    <main class="casino-table-vertical">
        
        <!-- SECCIÓN SUPERIOR: RUEDA HIPER-REALISTA -->
        <section class="wheel-section-v">
            <div class="wheel-container-hd">
                <canvas id="wheel-canvas" width="340" height="340"></canvas>
            </div>
        </section>

        <!-- BANNER DE ESTADO Y APUESTAS -->
        <div id="live-payout-message" class="status-banner">
            SELECCIONE SUS FICHAS Y APUESTAS MÚLTIPLES
        </div>

        <!-- SELECTOR DE FICHAS -->
        <section class="chips-rack">
            <div class="chip-stack c-purple" onclick="selectChip(10, this)"><span>10</span></div>
            <div class="chip-stack c-green active" onclick="selectChip(50, this)"><span>50</span></div>
            <div class="chip-stack c-red" onclick="selectChip(100, this)"><span>100</span></div>
            <div class="chip-stack c-blue" onclick="selectChip(500, this)"><span>500</span></div>
            <div class="chip-stack c-black" onclick="selectChip(1000, this)"><span>1K</span></div>
        </section>

        <!-- SECCIÓN INFERIOR: PAÑO DE APUESTAS -->
        <section class="board-section-v">
            
            <!-- RACETRACK (VECINOS) -->
            <div class="racetrack-container">
                <div class="racetrack">
                    <div class="rt-sector" onclick="placeSpecialBet('ZERO')">Zero</div>
                    <div class="rt-sector" onclick="placeSpecialBet('VOISINS')">Voisins</div>
                    <div class="rt-sector" onclick="placeSpecialBet('ORPHELINS')">Orphelins</div>
                    <div class="rt-sector" onclick="placeSpecialBet('TIERS')">Tiers</div>
                </div>
            </div>

            <!-- APUESTAS RÁPIDAS COLOR -->
            <div class="quick-color-bets">
                <button class="btn-quick red" onclick="placeBet('COLOR', 'rojo')">RED</button>
                <button class="btn-quick black" onclick="placeBet('COLOR', 'negro')">BLACK</button>
            </div>

            <!-- TABLERO PRINCIPAL DE NÚMEROS -->
            <div class="main-table-grid">
                <div class="tile zero-tile" onclick="placeBet('PLENO', 0)">0</div>
                <div class="numbers-wrapper" id="numbers-grid"></div>
                <div class="column-bets">
                    <div class="col-tile" onclick="placeBet('COLUMNA', 3)">2:1</div>
                    <div class="col-tile" onclick="placeBet('COLUMNA', 2)">2:1</div>
                    <div class="col-tile" onclick="placeBet('COLUMNA', 1)">2:1</div>
                </div>
            </div>

            <!-- DOCENAS Y EXTERIORES -->
            <div class="outside-bets-grid">
                <div class="doz-tile" onclick="placeBet('DOCENA', 1)">1st 12</div>
                <div class="doz-tile" onclick="placeBet('DOCENA', 2)">2nd 12</div>
                <div class="doz-tile" onclick="placeBet('DOCENA', 3)">3rd 12</div>

                <div class="ext-tile" onclick="placeBet('PASO', 1)">1-18</div>
                <div class="ext-tile" onclick="placeBet('PARIDAD', 'par')">EVEN</div>
                <div class="ext-tile" onclick="placeBet('COLOR', 'rojo')"><div class="diamond red"></div></div>
                <div class="ext-tile" onclick="placeBet('COLOR', 'negro')"><div class="diamond black"></div></div>
                <div class="ext-tile" onclick="placeBet('PARIDAD', 'impar')">ODD</div>
                <div class="ext-tile" onclick="placeBet('PASO', 2)">19-36</div>
            </div>

            <!-- BOTONES DE ACCIÓN -->
            <div class="action-bar">
                <button onclick="clearBets()" class="btn-action clear">BORRAR APUESTAS</button>
                <button onclick="spinWheel()" class="btn-action spin">GIRAR RUEDA 🎲</button>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
