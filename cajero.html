<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Cajero - Royal Casino</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: #08110c;
            color: #fff;
            padding: 20px;
        }
        .admin-card {
            background: #0d2116;
            border: 1px solid #1b4d2e;
            border-radius: 8px;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 { color: #ffd700; font-size: 1.2rem; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.8rem; color: #8fa896; font-weight: 700; }
        input {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #1b4d2e;
            background: #03180c;
            color: #fff;
            font-size: 0.9rem;
        }
        .btn-cajero {
            background: #2ecc71;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 5px;
        }
        .users-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .users-table th, .users-table td {
            border: 1px solid #1b4d2e;
            padding: 8px;
            text-align: left;
            font-size: 0.85rem;
        }
        .users-table th { background: #03180c; color: #ffd700; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>📌 Cargar / Retirar Fichas (Cajero)</h2>
        <div class="form-group">
            <label>Usuario Jugador:</label>
            <input type="text" id="target-user" placeholder="Ej: kevin">
        </div>
        <div class="form-group">
            <label>Cantidad de Fichas:</label>
            <input type="number" id="chips-amount" placeholder="Ej: 5000">
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="modifyUserChips('ADD')" class="btn-cajero" style="flex:1;">➕ CARGAR</button>
            <button onclick="modifyUserChips('REMOVE')" class="btn-cajero" style="background:#e74c3c; color:#fff; flex:1;">➖ RETIRAR</button>
        </div>
    </div>

    <div class="admin-card">
        <h2>👤 Crear Nuevo Jugador</h2>
        <div class="form-group">
            <label>Nuevo Usuario:</label>
            <input type="text" id="new-user" placeholder="Nombre de usuario">
        </div>
        <div class="form-group">
            <label>Contraseña:</label>
            <input type="password" id="new-pass" placeholder="Contraseña">
        </div>
        <div class="form-group">
            <label>Fichas Iniciales:</label>
            <input type="number" id="new-chips" value="1000">
        </div>
        <button onclick="createNewPlayer()" class="btn-cajero" style="width: 100%;">CREAR JUGADOR</button>
    </div>

    <div class="admin-card">
        <h2>📋 Lista de Jugadores Registrados</h2>
        <table class="users-table">
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Contraseña</th>
                    <th>Saldo Fichas</th>
                </tr>
            </thead>
            <tbody id="users-list-body"></tbody>
        </table>
    </div>

    <script src="cajero.js"></script>
</body>
</html>
